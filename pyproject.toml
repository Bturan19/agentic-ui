[project]
name = "agentic-ui"
version = "0.1.0"
description = "Pazaryeri kampanya portföyü için agentic kontrol konsolu"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic-settings>=2.5",
    "pydantic-ai-slim[google,mcp]>=1.0",
    "aiosqlite>=0.20",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "markdown>=3.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]

[project.urls]
Repository = "https://github.com/Bturan19/agentic-ui"
Documentation = "https://github.com/Bturan19/agentic-ui/blob/main/docs/integration.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "asyncpg>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
