{% extends "base.html" %}
{% block title %}Audit — Agentic Kampanya Konsolu{% endblock %}
{% block content %}
<div class="doc-pane wide">
  <header class="chat-header">
    <h1>Audit trail</h1>
    <span class="muted">Ajanın yaptığı her tool çağrısı ve onay kaydı</span>
  </header>

  <form id="audit-filters" class="filters"
        hx-get="/partials/audit-table" hx-target="#audit-table" hx-swap="innerHTML" hx-trigger="change">
    <label>
      Gün
      <select name="days">
        {% for option in [1, 3, 7, 30] %}
        <option value="{{ option }}" {% if option == days %}selected{% endif %}>{{ option }} gün</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Tür
      <select name="kind">
        <option value="">tümü</option>
        {% for option in ["tool_call", "tool_result", "approval_request", "approval", "user_message", "scheduled_trigger", "budget_change", "error"] %}
        <option value="{{ option }}" {% if option == kind %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>
    </label>
  </form>

  <div id="audit-table">
    {% include "partials/_audit_table.html" %}
  </div>
</div>
{% endblock %}
